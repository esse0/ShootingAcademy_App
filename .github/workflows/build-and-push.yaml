name: Build and Push Docker Images

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t $REGISTRY/${IMAGE_NAME_BACKEND}:latest ./backend
          docker push $REGISTRY/${IMAGE_NAME_BACKEND}:latest

      - name: Build and push frontend image
        run: |
          docker build -t $REGISTRY/${IMAGE_NAME_FRONTEND}:latest ./frontend
          docker push $REGISTRY/${IMAGE_NAME_FRONTEND}:latest
