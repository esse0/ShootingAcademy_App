apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/esse0/ShootingAcademy_App/backend:latest
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "database"
            - name: DB_USER
              value: "admin"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shooting-secrets
                  key: DB_PASSWORD
            - name: ASPNETCORE_URLS
              valueFrom:
                secretKeyRef:
                  name: shooting-secrets
                  key: ASPNETCORE_URLS
            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: shooting-secrets
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: shooting-secrets
                  key: JWT_AUDIENCE
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shooting-secrets
                  key: JWT_SECRET_KEY
            - name: JWT_ACCESS_EXPIRY_MINUTES
              valueFrom:
                secretKeyRef:
                  name: shooting-secrets
                  key: JWT_ACCESS_EXPIRY_MINUTES
            - name: JWT_REFRESH_EXPIRY_MINUTES
              valueFrom:
                secretKeyRef:
                  name: shooting-secrets
                  key: JWT_REFRESH_EXPIRY_MINUTES
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: shooting-secrets
                  key: SALT
